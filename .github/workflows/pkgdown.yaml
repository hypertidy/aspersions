# Builds the pkgdown site in the gdal-r-ci Rust image (GDAL, R, gdalraster, the hypertidy
# stack and Rust in one place) and deploys it to the gh-pages branch.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    container: ghcr.io/hypertidy/gdal-r-python-extras-rust:latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - name: R dependencies
        shell: Rscript {0}
        run: |
          repos <- c(CRAN = "https://cloud.r-project.org")
          for (p in c("pkgdown", "knitr", "rmarkdown", "gdalraster", "remotes")) {
            if (!requireNamespace(p, quietly = TRUE)) install.packages(p, repos = repos)
          }
          if (!requireNamespace("ximage", quietly = TRUE)) remotes::install_github("hypertidy/ximage")

      - name: Install aspersions
        run: R CMD INSTALL .

      - name: Build site
        shell: Rscript {0}
        run: |
          # report failures as annotations too, so they show without the full log
          tryCatch(
            pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE),
            error = function(e) {
              while (!is.null(e)) {
                cat("::error::", gsub("[\r\n]+", " ", conditionMessage(e)), "\n", sep = "")
                e <- e$parent
              }
              quit(status = 1)
            })

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: JamesIves/github-pages-deploy-action@v4
        if: github.event_name != 'pull_request'
        with:
          clean: false
          branch: gh-pages
          folder: docs
